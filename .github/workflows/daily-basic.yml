---
name: Daily Tests - basic

on:  # yamllint disable-line rule:truthy
    schedule:
        - cron: '00 13 * * *'   # every day at 13:00 UTC

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

    pull_request:
        paths:
            - '.github/workflows/daily-basic.yml'

jobs:
    basic:
        name: ${{ matrix.test }} on ${{ matrix.container }} on ${{ matrix.architecture.tag }}
        runs-on: ${{ matrix.architecture.runner }}
        timeout-minutes: ${{ matrix.architecture.timeout }}
        concurrency:
            group: >
                daily-basic-${{ github.workflow }}-${{ github.ref }}
                -${{ matrix.container }}-${{ matrix.test }}-${{ matrix.architecture.tag }}
            cancel-in-progress: true
        strategy:
            fail-fast: false
            matrix:
                architecture:
                    - runner: ubuntu-24.04
                      tag: amd
                      timeout: 10
                    - runner: ubuntu-24.04-arm
                      tag: arm
                      timeout: 40
                container:
                    - debian:latest
                    - debian:sid
                    - gentoo:latest
                    - opensuse:latest
                    - ubuntu:devel
                    - ubuntu:rolling
                    - void:latest
                test:
                    - "10"
                    - "11"
                    - "13"
                    - "14"
                    - "20"
                    - "21"
                    - "26"
                    - "30"
                    - "50"
                    - "80"
                    - "81"
                    - "82"
                    - "83"
                exclude:
                    # cpio is not installed on Debian/Ubuntu
                    - container: debian:sid
                      test: "83"
                    # cpio is not installed on Debian/Ubuntu
                    - container: ubuntu:devel
                      test: "83"
                    # cpio is not installed on Debian/Ubuntu
                    - container: ubuntu:rolling
                      test: "83"
        container:
            image: ghcr.io/dracut-ng/${{ matrix.container }}
            options: '--device=/dev/kvm --privileged'
        steps:
            - name: "Checkout Repository"
              uses: actions/checkout@v7
            - name: "${{ matrix.container }} TEST-${{ matrix.test }}"
              run: ./test/test-container.sh "TEST-${{ matrix.test }}" ${{ matrix.test }}
    extended:
        name: ${{ matrix.test }} on ${{ matrix.container }} on ${{ matrix.architecture.tag }}
        runs-on: ${{ matrix.architecture.runner }}
        timeout-minutes: ${{ matrix.architecture.timeout }}
        concurrency:
            group: >
                daily-basic-extended-${{ github.workflow }}-${{ github.ref }}
                -${{ matrix.container }}-${{ matrix.test }}-${{ matrix.architecture.tag }}
            cancel-in-progress: true
        strategy:
            fail-fast: false
            matrix:
                architecture:
                    - runner: ubuntu-24.04
                      tag: amd
                      timeout: 10
                container:
                    - alpine:edge
                    - arch:latest
                    - azurelinux:latest
                    - fedora:latest
                    - fedora:rawhide
                    - centos:latest
                    - gentoo:amd64-openrc
                test:
                    - "10"
                    - "11"
                    - "13"
                    - "14"
                    - "20"
                    - "21"
                    - "26"
                    - "30"
                    - "50"
                    - "80"
                    - "81"
                    - "82"
                    - "83"
                exclude:
                    # btrfs kernel module is not available on CentOS Stream 10
                    - container: centos:latest
                      test: "11"
        container:
            image: ghcr.io/dracut-ng/${{ matrix.container }}
            options: '--device=/dev/kvm --privileged'
        steps:
            - name: "Checkout Repository"
              uses: actions/checkout@v7
            - name: "${{ matrix.container }} TEST-${{ matrix.test }}"
              run: ./test/test-container.sh "TEST-${{ matrix.test }}" ${{ matrix.test }}
    arm64-openrc:
        name: ${{ matrix.test }} on ${{ matrix.container }} on ${{ matrix.architecture.tag }}
        runs-on: ${{ matrix.architecture.runner }}
        timeout-minutes: ${{ matrix.architecture.timeout }}
        concurrency:
            group: >
                daily-basic-${{ github.workflow }}-${{ github.ref }}
                -${{ matrix.container }}-${{ matrix.test }}-${{ matrix.architecture.tag }}
            cancel-in-progress: true
        strategy:
            fail-fast: false
            matrix:
                architecture:
                    - runner: ubuntu-24.04-arm
                      tag: arm
                      timeout: 40
                container:
                    - gentoo:arm64-openrc
                test:
                    - "10"
                    - "11"
                    - "13"
                    - "14"
                    - "20"
                    - "21"
                    - "26"
                    - "30"
                    - "50"
                    - "80"
                    - "81"
                    - "82"
                    - "83"
        container:
            image: ghcr.io/dracut-ng/${{ matrix.container }}
            options: '--device=/dev/kvm --privileged'
        steps:
            - name: "Checkout Repository"
              uses: actions/checkout@v7
            - name: "${{ matrix.container }} TEST-${{ matrix.test }}"
              run: ./test/test-container.sh "TEST-${{ matrix.test }}" ${{ matrix.test }}
