---
name: Daily Tests - network

on:  # yamllint disable-line rule:truthy
    schedule:
        - cron: '30 21 * * *'   # every day at 21:30 UTC

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

    pull_request:
        paths:
            - '.github/workflows/daily-network.yml'

jobs:
    network:
        name: ${{ matrix.test }} on ${{ matrix.container }} on ${{ matrix.architecture.tag }}
        runs-on: ${{ matrix.architecture.runner }}
        timeout-minutes: ${{ matrix.architecture.timeout }}
        concurrency:
            group: >
                daily-network-${{ github.workflow }}-${{ github.ref }}
                -${{ matrix.container }}-${{ matrix.test }}-${{ matrix.architecture.tag }}
            cancel-in-progress: true
        strategy:
            fail-fast: false
            matrix:
                architecture:
                    - runner: ubuntu-24.04
                      tag: amd
                      timeout: 15
                    - runner: ubuntu-24.04-arm
                      tag: arm
                      timeout: 60
                container:
                    - arch:latest
                    - debian:latest
                    - debian:sid
                    - fedora:latest
                    - fedora:rawhide
                    - opensuse:latest
                    - ubuntu:devel
                    - ubuntu:rolling
                test:
                    - "31"
                    - "60"
                    - "61"
                exclude:
                    # arch container does not support arm
                    - container: arch:latest
                      architecture: {runner: 'ubuntu-24.04-arm', tag: 'arm'}
                    # https://github.com/dracut-ng/dracut/issues/2612
                    - container: fedora:latest
                      architecture: {runner: 'ubuntu-24.04-arm', tag: 'arm'}
                    # https://github.com/dracut-ng/dracut/issues/2612
                    - container: fedora:rawhide
                      architecture: {runner: 'ubuntu-24.04-arm', tag: 'arm'}
                    # https://github.com/dracut-ng/dracut/issues/2541
                    - container: debian:latest
                      test: "61"
                    - container: debian:sid
                      test: "61"
                    - container: ubuntu:devel
                      test: "61"
                    - container: ubuntu:rolling
                      test: "61"
                    # https://github.com/dracut-ng/dracut/issues/2522
                    - container: fedora:rawhide
                      test: "60"
        container:
            image: ghcr.io/dracut-ng/${{ matrix.container }}
            options: '--device=/dev/kvm --privileged'
        steps:
            - name: "Checkout Repository"
              uses: actions/checkout@v7
            - name: "${{ matrix.container }} TEST-${{ matrix.test }}"
              run: ./test/test-container.sh "TEST-${{ matrix.test }}" ${{ matrix.test }}
