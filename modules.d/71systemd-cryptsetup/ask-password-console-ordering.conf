[Unit]
# The passphrase prompt (systemd-ask-password-console.service) already orders
# itself after systemd-vconsole-setup.service (After=); this Wants= only pulls
# the keyboard setup in when a passphrase is actually being asked, so keyfile,
# TPM2 and FIDO2 unlocks never wait on the console. A missing or failing setup
# does not block the prompt (Wants= is not Requires=).
Wants=systemd-vconsole-setup.service
